name: PHP Tests

# Runs on every push to main (this includes PR merges) and on any PR
# targeting main (so the suite is validated BEFORE the merge, not only after).
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
    group: php-tests-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    tests:
        name: PHPUnit (PHP 8.2)
        runs-on: ubuntu-latest

        # MySQL is required because the kernel boots Doctrine and the integration
        # suite spins up the real Symfony stack (WebTestCase).
#        services:
#            mysql:
#                image: mysql:8.0
#                env:
#                    MYSQL_ROOT_PASSWORD: root
#                    MYSQL_DATABASE: signalist_test
#                ports:
#                    - 3306:3306
#                options: >-
#                    --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
#                    --health-interval=10s
#                    --health-timeout=5s
#                    --health-retries=5

        # Values are CI-only dummies — enough for the container to compile and the
        # kernel to boot. Real secrets live in .env.local / GitHub Secrets, never here.
        env:
            APP_ENV: test
            APP_DEBUG: 0
            APP_SECRET: ci_dummy_secret_do_not_use_in_prod
            DATABASE_URL: "mysql://root:root@127.0.0.1:3306/signalist_test?serverVersion=8.0.32&charset=utf8mb4"
            MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
            MESSENGER_MAX_RETRIES: 3
            MAILER_DSN: "null://null"
            JWT_SECRET: ci_dummy_jwt_secret_at_least_32_chars_long
            JWT_ALGORITHM: HS256
            JWT_ACCESS_TTL: 900
            JWT_REFRESH_TTL: 604800
            FINNHUB_BASE_URL: "https://finnhub.io/api/v1"
            FINNHUB_TOKEN: ci_dummy_finnhub_token
            CORS_ALLOW_ORIGIN: "^https?://localhost(:[0-9]+)?$"
            DEFAULT_URI: "http://localhost"
            SENTRY_DSN: ""

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP 8.2
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.2"
                  extensions: ctype, iconv, intl, pdo_mysql, mbstring
                  coverage: none
                  tools: composer:v2

            - name: Validate composer.json
              run: composer validate --strict

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

            - name: Cache Composer packages
              uses: actions/cache@v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-php84-${{ hashFiles('**/composer.lock') }}
                  restore-keys: ${{ runner.os }}-composer-php84-

            - name: Install dependencies
              run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

#            - name: Prepare test database schema
#              run: |
#                  php bin/console doctrine:database:create --if-not-exists --no-interaction || true
#                  php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

            - name: Run unit tests
              run: composer test:unit

            - name: Run integration tests
              run: composer test:integration
